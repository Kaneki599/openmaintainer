name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the command, observed result, and expected result.
    validations:
      required: true
  - type: input
    attributes:
      label: OpenMaintainer version
    validations:
      required: true
  - type: input
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
      description: Link a public repository or provide the smallest safe example.
    validations:
      required: true
