name: Feature request
description: Propose a focused improvement or rule.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What maintainer workflow is difficult today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, and expected false-positive boundaries.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Which existing tools or workarounds did you consider?
