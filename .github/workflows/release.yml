name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build package archive
        id: package
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: gh release create "$GITHUB_REF_NAME" "$PACKAGE_FILE" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
      - name: Publish npm package
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish "${{ steps.package.outputs.file }}" --access public --provenance
