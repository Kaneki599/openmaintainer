name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: ./
        if: matrix.node == 24
        with:
          output: self-openmaintainer-report.md
      - if: matrix.node == 24
        run: test -s self-openmaintainer-report.md
      - if: matrix.node == 24
        run: npm run bundle:action
      - if: matrix.node == 24
        run: git diff --exit-code -- dist/action.cjs
