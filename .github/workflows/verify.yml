name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run bundle:action
      - run: git diff --exit-code -- dist/action.cjs
